<h2>Application Approval Status</h2>
<div class="container">
   
    <table class="table table-sm table-bordered m-t-4 table-striped" >
    <thead>
    <tr class="bg-primary">
        <th>id</th>
        <th>customerName</th>
        <th>customerMobileno</th>
        <th>customerEmailId</th> 
         <th>customerPanNo</th>
        <th>loanStatus</th>
        <th>Action</th>
       
        
      
    </tr>
</thead>
<tbody *ngIf="retrievedDoc">
        <tr *ngFor="let c of retrievedDoc">
                <ng-container *ngIf="c.loanStatus =='Approved'">
            
             <td>{{c.id}}</td>
             <td>{{c.customerName}}</td>
             <td>{{c.customerMobileno}}</td>
             <td>{{c.customerEmailId}}</td>
             <td>{{c.customerPanNo}}</td>
             <td>{{c.loanStatus}}</td>
             <td><a class="btn btn-primary" (click)="mailsend(c.id)">Send Mail</a></td>
            </ng-container>
            </tr>
       
        
    
    </tbody>
    </table>
</div>
