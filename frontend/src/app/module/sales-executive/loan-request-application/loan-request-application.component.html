<div class="loan-request-page">
  <div class="loan-card">
    <div class="card-header bg-primary text-white">
      <h4 class="text-uppercase text-center">Registration</h4>
    </div>

    <form class="loan-form" [formGroup]="basicdetails" *ngIf="basic == true">
      <h3 class="section-title">Basic Details</h3>

      <div class="form-group col-md-4"><label>Customer Name</label><input type="text" class="form-control" formControlName="customerName" placeholder="Customer Name" /></div>
      <div class="form-row"><div class="form-group col-md-6"><label>Customer Email</label><input type="email" class="form-control" formControlName="customerEmailId" placeholder="Customer Email ID" /></div><div class="form-group col-md-6"><label>Customer Mobile No</label><input type="text" class="form-control" formControlName="customerMobileno" placeholder="Customer Mobile No" /></div></div>
      <div class="form-row"><div class="form-group col-md-6"><label>Customer DOB</label><input type="date" class="form-control" formControlName="customerDOB" /></div><div class="form-group col-md-6"><label>Customer Gender</label><input type="text" class="form-control" formControlName="customerGender" placeholder="Gender" /></div></div>
      <div class="form-row"><div class="form-group col-md-6"><label>Customer PAN No.</label><input type="text" class="form-control" formControlName="customerPanNo" placeholder="Customer PAN No." /></div><div class="form-group col-md-6"><label>Customer Aadhar No.</label><input type="text" class="form-control" formControlName="customerAadharNo" placeholder="Customer Aadhar No." /></div></div>
      <div class="form-row"><div class="form-group col-md-6"><label>Customer Income</label><input type="text" class="form-control" formControlName="customerIncome" placeholder="Customer Income" /></div><div class="form-group col-md-6"><label>Loan Status</label><input type="text" class="form-control" formControlName="loanStatus" placeholder="Loan Status" /></div></div>
      <div class="form-group col-md-6"><label>Verification</label><input type="text" class="form-control" formControlName="verificationn" placeholder="Verification" /></div>

      <div formGroupName="customerlocalAddress"><h4 class="section-title">Current Address</h4><div class="form-group col-md-12"><label>Area Name</label><input type="text" class="form-control" formControlName="areaName" placeholder="Area Name" /></div><div class="row"><div class="form-group col-md-4"><label>State</label><select class="select" formControlName="state"><option value="">Choose...</option><option>Maharashtra</option><option>Rajasthan</option><option>Goa</option></select></div><div class="form-group col-md-4"><label>District</label><select class="select" formControlName="district"><option value="">Choose...</option><option>PUNE</option><option>NAGPUR</option><option>NANDED</option></select></div><div class="form-group col-md-4"><label>City</label><select class="select" formControlName="cityName"><option value="">Choose...</option><option>PUNE</option><option>NAGPUR</option><option>NANDED</option></select></div></div><div class="form-group col-md-4"><label>PIN Code</label><input type="text" class="form-control" formControlName="pincode" placeholder="PIN Code" /></div></div>

      <div formGroupName="customerPermanentAddress"><h4 class="section-title">Permanent Address</h4><div class="form-group col-md-12"><label>Area Name</label><input type="text" class="form-control" formControlName="areaName" placeholder="Area Name" /></div><div class="row"><div class="form-group col-md-4"><label>State</label><select class="select" formControlName="state"><option value="">Choose...</option><option>Maharashtra</option><option>Rajasthan</option><option>Goa</option></select></div><div class="form-group col-md-4"><label>District</label><select class="select" formControlName="district"><option value="">Choose...</option><option>PUNE</option><option>NAGPUR</option><option>NANDED</option></select></div><div class="form-group col-md-4"><label>City</label><select class="select" formControlName="cityName"><option value="">Choose...</option><option>PUNE</option><option>NAGPUR</option><option>NANDED</option></select></div></div><div class="form-group col-md-4"><label>PIN Code</label><input type="text" class="form-control" formControlName="pincode" placeholder="PIN Code" /></div></div>

      <div formGroupName="guarantorDetails"><h4 class="section-title">Guarantor Details</h4><div class="form-group col-md-4"><label>Guarantor Name</label><input type="text" class="form-control" formControlName="guarantorName" placeholder="Guarantor Name" /></div><div class="form-row"><div class="form-group col-md-6"><label>Guarantor Email</label><input type="email" class="form-control" formControlName="guarantorEmailId" placeholder="Guarantor Email ID" /></div><div class="form-group col-md-6"><label>Guarantor Mobile No</label><input type="text" class="form-control" formControlName="guarantorMobileNo" placeholder="Guarantor Mobile No" /></div></div><div class="form-group col-md-12"><label>Guarantor Address</label><input type="text" class="form-control" formControlName="guarantorAddress" placeholder="Guarantor Address" /></div></div>

      <div formGroupName="customerBankAccountDetails"><h4 class="section-title">Bank Details</h4><div class="form-row"><div class="form-group col-md-4"><label>Bank Name</label><input type="text" class="form-control" formControlName="bankName" placeholder="Bank Name" /></div><div class="form-group col-md-4"><label>Account Number</label><input type="text" class="form-control" formControlName="accountNumber" placeholder="Account Number" /></div><div class="form-group col-md-4"><label>IFSC Code</label><input type="text" class="form-control" formControlName="ifscCode" placeholder="IFSC Code" /></div></div><div class="form-group col-md-12"><label>Branch Address</label><input type="text" class="form-control" formControlName="address" placeholder="Branch Address" /></div></div>

      <button type="button" class="btn btn-primary" (click)="basics()">NEXT</button>
    </form>

    <div *ngIf="upload == true">
      <h3 class="section-title document-title">Upload Documents</h3>
      <form class="document-form" [formGroup]="documentUpload">
        <div class="custom-file"><input type="file" class="custom-file-input" id="customFile1" (change)="onSelectedFile1($event)" /><img [src]="imageSrc1" height="50"><label class="custom-file-label" for="customFile1">PAN Card</label></div>
        <div class="custom-file"><input type="file" class="custom-file-input" id="customFile2" (change)="onSelectedFile2($event)" /><img [src]="imageSrc2" height="50"><label class="custom-file-label" for="customFile2">Aadhar Card</label></div>
        <div class="custom-file"><input type="file" class="custom-file-input" id="customFile3" (change)="onSelectedFile3($event)" /><img [src]="imageSrc3" height="50"><label class="custom-file-label" for="customFile3">Bank Passbook</label></div>
        <div class="custom-file"><input type="file" class="custom-file-input" id="customFile4" (change)="onSelectedFile4($event)" /><img [src]="imageSrc4" height="50"><label class="custom-file-label" for="customFile4">Photo</label></div>
        <div class="custom-file"><input type="file" class="custom-file-input" id="customFile5" (change)="onSelectedFile5($event)" /><img [src]="imageSrc5" height="50"><label class="custom-file-label" for="customFile5">Signature</label></div>
        <div class="custom-file"><input type="file" class="custom-file-input" id="customFile6" (change)="onSelectedFile6($event)" /><img [src]="imageSrc6" height="50"><label class="custom-file-label" for="customFile6">Cancelled Check</label></div>
        <div class="custom-file"><input type="file" class="custom-file-input" id="customFile7" (change)="onSelectedFile7($event)" /><img [src]="imageSrc7" height="50"><label class="custom-file-label" for="customFile7">Salary Slip</label></div>
        <div class="custom-file"><input type="file" class="custom-file-input" id="customFile8" (change)="onSelectedFile8($event)" /><img [src]="imageSrc8" height="50"><label class="custom-file-label" for="customFile8">Sanction Letter</label></div>
      </form>

      <div class="terms-box">
        <label class="terms-label"><input type="checkbox" [(ngModel)]="agreeTerms" [ngModelOptions]="{standalone: true}" /><span>I agree to the terms and conditions</span></label>
        <button type="button" class="btn btn-primary submit-btn" (click)="submit()" [disabled]="submitting">{{ submitting ? 'Submitting...' : 'Submit Application' }}</button>
      </div>
    </div>
  </div>
</div>
