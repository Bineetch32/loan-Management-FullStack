<div class="sanction-page">
  <div class="page-header">
    <div>
      <h2>Generate Sanction Letter</h2>
      <p>Review the verified applicant details and prepare the sanction letter.</p>
    </div>
    <button type="button" class="back-button" (click)="getback()">Back</button>
  </div>

  <form #invoiceForm="ngForm">
    <section class="card">
      <h3>Customer Details</h3>

      <div class="info-grid">
        <div class="info-item">
          <label>Application ID</label>
          <span>#{{invoice.applicationId}}</span>
        </div>
        <div class="info-item">
          <label>Customer Name</label>
          <span>{{invoice.customerName}}</span>
        </div>
        <div class="info-item">
          <label>Mobile Number</label>
          <span>{{invoice.contactNo}}</span>
        </div>
        <div class="info-item">
          <label>Email</label>
          <span>{{invoice.email}}</span>
        </div>
        <div class="info-item full-width">
          <label>Current Address</label>
          <span>{{invoice.address}}</span>
        </div>
      </div>
    </section>

    <section class="card">
      <h3>Sanction Details</h3>

      <div class="form-grid">
        <div class="form-group">
          <label for="loanAmount">Loan Amount</label>
          <input
            id="loanAmount"
            type="number"
            name="loanAmount"
            class="form-control"
            [(ngModel)]="invoice.loanAmount"
            #loanAmount="ngModel"
            required
            min="1">
        </div>

        <div class="form-group">
          <label for="interest">Interest Rate (%)</label>
          <input
            id="interest"
            type="number"
            name="interest"
            class="form-control"
            [(ngModel)]="invoice.interest"
            #interest="ngModel"
            required
            min="0">
        </div>
      </div>

      <div class="form-group">
        <label for="additionalDetails">Additional Details</label>
        <textarea
          id="additionalDetails"
          name="additionalDetails"
          class="form-control"
          rows="4"
          [(ngModel)]="invoice.additionalDetails"
          placeholder="Enter any important sanction terms or notes"></textarea>
      </div>
    </section>

    <section class="action-card">
      <button
        type="button"
        class="generate-button"
        [disabled]="!invoiceForm.valid || !invoice.customerName"
        (click)="generatePDF('download')">
        Generate & Download Sanction Letter
      </button>

      <button type="button" class="back-button" (click)="getback()">
        Cancel
      </button>
    </section>
  </form>
</div>
