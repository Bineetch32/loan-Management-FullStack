    <form #invoiceForm="ngForm">
        <div class="container-fluid pt-2 mb-5">
            <div class="row">
                <div class="col-md-10">
                    <div class="card border-secondary">
                        <div class="card-body">
                            <h4 class="card-title">Customer Details</h4>
                            <div class="row">
                                <div class="col-md-8">
                                    <div class="form-group">
                                        <label for="name">Name</label>
                                        <input type="text" class="form-control" name="name" id="customerName"
                                            [ngClass]="{'is-invalid': invoiceForm.submitted && CustName.invalid}"
                                            [(ngModel)]="invoice.customerName" #CustName="ngModel" required>
                                    </div>
    
    
                                    <div class="form-group">
                                        <label for="address">Address</label>
                                        <textarea class="form-control" name="address" id="address" rows="3"
                                            [ngClass]="{'is-invalid': invoiceForm.submitted && Address.invalid}"
                                            [(ngModel)]="invoice.address" #Address="ngModel" required></textarea>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="email">Email ID</label>
                                        <input type="email" class="form-control" name="email" id="customerEmailId"
                                            [(ngModel)]="invoice.email" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="contactNo">Contact No.</label>
                                        <input type="number" class="form-control" name="contactNo" id="contactNo"
                                            [ngClass]="{'is-invalid': invoiceForm.submitted && ContactNo.invalid}"
                                            [(ngModel)]="invoice.contactNo" #ContactNo="ngModel" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card border-secondary mt-2">
                        <div class="card-body">
                            <h4 class="card-title d-flex justify-content-between">Loan Details</h4>
                            <input type="number" class="form-control" name="loanIntrest" [(ngModel)]="invoice.interest" />Intrest Rate<br>
                            <input type="number" class="form-control" name="LoanAmount" [(ngModel)]="invoice.loanAmount" />Loan Amount<br>
                        </div>
                    </div>
                    <div class="card border-secondary mt-2">
                        <div class="card-body">
                            <h4 class="card-title">Additional Details</h4>
                            <div class="form-group">
                                <textarea class="form-control" name="additionalDetails" rows="3"
                                    [(ngModel)]="invoice.additionalDetails"></textarea>
                            </div>
                        </div>
                    </div>
    
                </div>
                <div class="col-md-2">
    
                    <button type="button" class="btn btn-primary"
                        (click)="invoiceForm.valid ? generatePDF('download') : ''">Download </button>
    
                    <!-- <button type="button" class="btn btn-primary "
                      (click)="generatePDF('download')">Download </button> -->
                    <br><br>
                    <button type="button" class="btn btn-primary"
                        (click)="getback()">Go Back </button>
                    <br><br>
    
    
    
                </div>
            </div>
        </div>
    </form>
    <footer class="fixed-bottom">
    
    </footer>
