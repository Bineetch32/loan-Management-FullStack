<div class="container jumbotron">
    <h5>ENQUIRY LIST</h5>
    <table class="table table-sm table-bordered m-t-4 table-striped">
      <thead>
        <tr class="bg-primary"> 
          <th> Id</th>
          <th>Customer Name</th>
          <th>Customer MobileNo</th>
          <th>Customer EmailId</th>
          <th>Customer PanNo</th>
          <th>Cibil Score</th>
          <th>Eligibility</th>
          <th>Detail</th>
          <th>Check Cibil</th>
          <th>Send Email</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let enq1 of enqlist">
          <td>{{enq1.id}}</td>
          <td>{{enq1.customerName}}</td>
          <td>{{enq1.customerMobileno}}</td>
          <td>{{enq1.customerEmailId}}</td>
          <td>{{enq1.customerPanNo}}</td>
          <td>{{enq1.cibil}}</td>
          <td>{{enq1.eligiblity}}</td>
          <td><a class="btn" [routerLink]="['ed',enq1.id]">show Details</a></td>
          <td><button type="submit" class="btn btn-success" name="cibil" value="cibil" (click)="checkcibilscore(enq1)">Check Cibil</button></td>
          <button class="btn btn-success" (click)="mailsend(enq1.id)">Mail</button>
          
        </tr>
      </tbody>
    </table>
  </div>
