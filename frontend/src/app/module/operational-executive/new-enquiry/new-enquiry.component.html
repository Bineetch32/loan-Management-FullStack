<div class="enquiry-page">
  <div class="enquiry-card">
    <div class="enquiry-header">
      <h2>NEW ENQUIRY</h2>
      <p>Enter basic customer details to create a loan enquiry.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="submitCall()">
      <div class="form-row">
        <div class="form-group">
          <label>Customer Name</label>
          <input type="text" class="form-control" formControlName="customerName" placeholder="Enter customer name">
        </div>

        <div class="form-group">
          <label>Customer Mobile No.</label>
          <input type="text" class="form-control" formControlName="customerMobileno" placeholder="Enter mobile number">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Customer Email</label>
          <input type="email" class="form-control" formControlName="customerEmailId" placeholder="Enter email address">
        </div>

        <div class="form-group">
          <label>Customer PAN No.</label>
          <input type="text" class="form-control" formControlName="customerPanNo" placeholder="Enter PAN number">
        </div>
      </div>

      <button type="submit" class="btn btn-primary enquiry-btn">Save Enquiry</button>
    </form>
  </div>
</div>
